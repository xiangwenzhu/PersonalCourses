# 课程站：course.leozhu.cn -> 静态文件（由 GitHub Actions rsync 到 /var/www/personalcourses）
server {
    listen 80;
    listen [::]:80;

    server_name course.leozhu.cn;

    root /var/www/personalcourses;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }
}
